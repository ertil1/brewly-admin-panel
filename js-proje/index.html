<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brewly | Yönetim Paneli</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <span>☕</span> Brewly Admin
    </div>
    <div class="user-profile">
      <span>Yönetici: Ertuğrul İltizar</span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <div class="page-header">
      <div>
        <h1 class="page-title">Kahve Menüsü</h1>
        <p class="page-subtitle">Sistemdeki tüm kahveleri yönetin, fiyatları güncelleyin.</p>
      </div>
      <button class="btn btn-primary" id="btn-add-product">
        <span>➕</span> Yeni Ürün Ekle
      </button>
    </div>

    <!-- Product Grid Container -->
    <div class="product-grid" id="product-grid">
      <!-- Cards will be rendered here by JS -->
    </div>
  </main>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="product-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Ürün Ekle</h2>
        <button class="close-btn" id="btn-close-modal">&times;</button>
      </div>
      
      <form id="product-form">
        <input type="hidden" id="product-id">
        
        <div class="form-group">
          <label>Kahve Adı</label>
          <input type="text" id="product-name" class="form-control" placeholder="Örn: Caramel Latte" required>
        </div>
        
        <div class="form-group">
          <label>Kategori</label>
          <select id="product-category" class="form-control" required>
            <option value="Sıcak İçecek">Sıcak İçecek</option>
            <option value="Soğuk İçecek">Soğuk İçecek</option>
            <option value="Tatlı">Tatlı</option>
          </select>
        </div>
        
        <div class="form-group">
          <label>Fiyat (₺)</label>
          <input type="number" id="product-price" class="form-control" placeholder="Örn: 85" min="0" required>
        </div>
        
        <div class="form-group">
          <label>İkon (Emoji)</label>
          <input type="text" id="product-icon" class="form-control" placeholder="Örn: ☕" required>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-cancel" id="btn-cancel-modal">İptal</button>
          <button type="submit" class="btn btn-primary" id="btn-save-modal">Kaydet</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Entry Point -->
  <script type="module" src="App.js"></script>
</body>
</html>
